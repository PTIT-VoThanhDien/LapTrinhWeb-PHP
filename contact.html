<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu - MiniShop</title>
</head>
<body>
    <!-- ĐẦU TRANG -->
    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a> |
            <a href="about.html">Giới thiệu</a> |
            <a href="register.html">Đăng ký</a> |
            <a href="cart.html">Giỏ hàng</a> |
            <a href="contact.html">Liên hệ</a>
        </nav>
    </header>

    <main>
        <form action="contact.html" class="form">
            <label for="name">Họ và tên</label><br>
            <input type="text" id="name" name="name" required placeholder="Nguyễn Văn A"><br><br>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required placeholder="abc@gmail.com"><br><br>
            <label for="message">Tiêu đề</label><br>
            <input type="text" id="message" name="message" required placeholder="Nhập tiêu đề"><br><br>
            <label for="content">Nội dung</label><br>
            <textarea id="content" name="content" rows="5" required placeholder="Nhập nội dung"></textarea><br><br>
            <button type="submit">Gửi</button>
        </form>
    </main>

<footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>
</body>
</html>
